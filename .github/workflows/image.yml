name: Image

# main へのマージ時に実行イメージをビルドし、コミットIDのタグで GHCR へ出す。
# 配備先（apps-01）はこのタグを取得するだけで、ホスト上ではビルドしない。
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR のイメージ名は小文字のみ。オーナー名はここで固定する。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/Dockerfile
          push: true
          tags: ghcr.io/ruruthegeek/ubsleepy-next:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
